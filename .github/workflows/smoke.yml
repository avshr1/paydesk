name: Live smoke test

# Checks the live site, not just the code: CI tests against its own database,
# so it can't see problems like a production database missing its tables.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * *" # daily, an hour after the reminder job
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check the live site
        env:
          BASE_URL: https://paydesk-theta.vercel.app
          # After a push, wait for that commit to be deployed first.
          EXPECT_VERSION: ${{ github.event_name == 'push' && github.sha || '' }}
        run: node scripts/smoke-test.mjs
