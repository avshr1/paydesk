services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: paydesk
      POSTGRES_PASSWORD: paydesk
      POSTGRES_DB: paydesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paydesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
